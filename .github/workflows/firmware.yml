name: Firmware
on:
  push:
    branches:
      - "**"
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build_firmware:
    name: build (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Every board in platformio.ini, so none of them can break unnoticed (the PC environments
      # native and native_googletest are for the unit tests below)
      matrix:
        env: [teensy31, teensy40]

    steps:
      - uses: actions/checkout@v7
      # The build runs in the firmware image (.docker/firmware), through the same script as a local
      # build, so CI uses the same pinned PlatformIO. The script sets LOCAL_UID and LOCAL_GID to
      # the runner's user.
      # PIO_CORE is a folder for PlatformIO's downloads in $RUNNER_TEMP, a temporary folder that
      # GitHub empties at the start and end of each job. Each step runs in a new shell, so an
      # exported variable would be gone in the next step. Instead, the step appends the line
      # PIO_CORE=<folder> to the file whose path is in $GITHUB_ENV, and GitHub sets PIO_CORE in
      # every later step of this job. runner.temp below is the same folder as $RUNNER_TEMP.
      - name: Settings for the firmware container
        run: |
          echo "PIO_CORE=$RUNNER_TEMP/pio-core" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/pio-core"
      # Each job starts on a fresh machine, so PlatformIO would download the Teensy toolchain every
      # time. actions/cache restores the PIO_CORE folder from an earlier run, and saves it after a
      # successful job when no cache had the exact key. compose.yaml mounts that folder as the
      # container's /pio-core. One cache per board, so the two jobs don't write the same one. When
      # requirements.txt or platformio.ini changed, no cache has the exact key, and restore-keys
      # restores the newest cache of the same board instead.
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/pio-core
          key: pio-core-${{ runner.os }}-${{ runner.arch }}-${{ matrix.env }}-${{ hashFiles('.docker/firmware/requirements.txt', 'diffbot_firmware/platformio.ini') }}
          restore-keys: |
            pio-core-${{ runner.os }}-${{ runner.arch }}-${{ matrix.env }}-
      - name: Build the firmware
        run: .docker/firmware/run.sh pio run -e ${{ matrix.env }}
      # The include check (diffbot_firmware/tools/check_includes.sh) on a fixed source and header
      # with this board's flags, to see that the script still works with the board's toolchain.
      # Older warnings in the two files don't fail the step, only an error of clang-tidy. Checking
      # the files that a pull request changes is #117.
      - name: Run the include check on two board files
        run: .docker/firmware/run.sh tools/check_includes.sh ${{ matrix.env }} src/main.cpp lib/base_controller/base_controller.h

  # The firmware's unit tests that run on the PC, without a Teensy, for example the BNO055 driver
  # with a fake I2C bus. platformio.ini has one environment for each test framework: native runs
  # the Unity suites and native_googletest the GoogleTest suites. Both build for PlatformIO's
  # native platform, which the job's name stands for. They run in the same firmware container as
  # the builds, with a cache of their own for the native platform.
  unit_tests:
    name: unit tests (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Settings for the firmware container
        run: |
          echo "PIO_CORE=$RUNNER_TEMP/pio-core" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/pio-core"
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/pio-core
          key: pio-core-${{ runner.os }}-${{ runner.arch }}-native-${{ hashFiles('.docker/firmware/requirements.txt', 'diffbot_firmware/platformio.ini') }}
          restore-keys: |
            pio-core-${{ runner.os }}-${{ runner.arch }}-native-
      # pio test also passes when no test of an environment passed, for example when PlatformIO
      # finds no suite folder for it, or when every test is skipped. So the step has PlatformIO
      # write its JSON report, which lists each suite with its environment (env_name) and each
      # test case with its status. jq counts each environment's test cases with the status
      # PASSED, and the step fails when one of the two environments has none.
      - name: Run the unit tests
        run: |
          .docker/firmware/run.sh pio test -e native -e native_googletest \
            --json-output-path .pio/unit-test-report.json
          for environment in native native_googletest; do
            passed="$(jq --arg environment "$environment" \
              '[.test_suites[] | select(.env_name == $environment) | .test_cases[]
                | select(.status == "PASSED")] | length' \
              diffbot_firmware/.pio/unit-test-report.json)"
            echo "$environment: $passed test cases passed"
            if [ "$passed" -eq 0 ]; then
              echo "::error::No test case of the environment $environment passed"
              exit 1
            fi
          done
      # The unit tests of tools/board_flags.py, which turns PlatformIO's compile command into
      # clang's flags for the include check
      - name: Test the include check's flag helper
        run: .docker/firmware/run.sh python3 -m unittest discover -s tools
      # The include check on a fixed source and header with the unit tests' flags, as in the
      # build jobs above
      - name: Run the include check on two PC files
        run: .docker/firmware/run.sh tools/check_includes.sh native test/test_bno055/test_bno055.cpp lib/imu/bno055.h
      # The same check on the GoogleTest suite, with the flags of its environment native_googletest
      - name: Run the include check on the GoogleTest suite
        run: .docker/firmware/run.sh tools/check_includes.sh native_googletest test/googletest/test_wire_bus/test_wire_bus.cpp
      # The include check's flags for GoogleTest suites, with the samples in
      # tools/include_check_samples, whose folder test mirrors diffbot_firmware/test.
      # googletest_suite.cpp needs GoogleMock and PlatformIO's definitions for a test build.
      # order_case.cpp needs its suite's folder before the folders above it, two_levels_case.cpp
      # those folders with the outermost first, shared_source.cpp the folder test, and
      # inner_case.cpp no enclosing suite's folder. These five have to pass. unity_header.cpp and rosserial_header.cpp have to pass with native, and fail with
      # the status 1 with native_googletest, which has neither library.
      - name: Check the include check's flags for GoogleTest suites
        run: |
          samples=tools/include_check_samples
          .docker/firmware/run.sh tools/check_includes.sh native_googletest \
            "$samples/googletest_suite.cpp" \
            "$samples/test/googletest/test_include_order/cases/order_case.cpp" \
            "$samples/test/googletest/deep/test_two_levels/two_levels_case.cpp" \
            "$samples/test/googletest/shared_source.cpp" \
            "$samples/test/googletest/test_outer/test_inner/inner_case.cpp"
          .docker/firmware/run.sh tools/check_includes.sh native \
            "$samples/unity_header.cpp" "$samples/rosserial_header.cpp"
          for sample in unity_header rosserial_header; do
            status=0
            .docker/firmware/run.sh tools/check_includes.sh native_googletest \
              "$samples/$sample.cpp" || status=$?
            if [ "$status" -ne 1 ]; then
              echo "::error::The include check ended with status $status on $sample.cpp, not with 1"
              exit 1
            fi
          done
