name: Firmware
on:
  push:
    branches:
      - "**"
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build_firmware:
    name: build (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Every board in platformio.ini, so none of them can break unnoticed (the native
      # environment is for the unit tests below)
      matrix:
        env: [teensy31, teensy40]

    steps:
      - uses: actions/checkout@v7
      # The build runs in the firmware image (.docker/firmware), through the same script as a local
      # build, so CI uses the same pinned PlatformIO. The script sets LOCAL_UID and LOCAL_GID to
      # the runner's user.
      # PIO_CORE is a folder for PlatformIO's downloads in $RUNNER_TEMP, a temporary folder that
      # GitHub empties at the start and end of each job. Each step runs in a new shell, so an
      # exported variable would be gone in the next step. Instead, the step appends the line
      # PIO_CORE=<folder> to the file whose path is in $GITHUB_ENV, and GitHub sets PIO_CORE in
      # every later step of this job. runner.temp below is the same folder as $RUNNER_TEMP.
      - name: Settings for the firmware container
        run: |
          echo "PIO_CORE=$RUNNER_TEMP/pio-core" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/pio-core"
      # Each job starts on a fresh machine, so PlatformIO would download the Teensy toolchain every
      # time. actions/cache restores the PIO_CORE folder from an earlier run, and saves it after a
      # successful job when no cache had the exact key. compose.yaml mounts that folder as the
      # container's /pio-core. One cache per board, so the two jobs don't write the same one. When
      # requirements.txt or platformio.ini changed, no cache has the exact key, and restore-keys
      # restores the newest cache of the same board instead.
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/pio-core
          key: pio-core-${{ runner.os }}-${{ runner.arch }}-${{ matrix.env }}-${{ hashFiles('.docker/firmware/requirements.txt', 'diffbot_firmware/platformio.ini') }}
          restore-keys: |
            pio-core-${{ runner.os }}-${{ runner.arch }}-${{ matrix.env }}-
      - name: Build the firmware
        run: .docker/firmware/run.sh pio run -e ${{ matrix.env }}

  # The firmware's unit tests that run on the PC, without a Teensy, for example the BNO055 driver
  # with a fake I2C bus. platformio.ini has one environment for each test framework: native runs
  # the Unity suites and native_googletest the GoogleTest suites. Both build for PlatformIO's
  # native platform, which the job's name stands for. They run in the same firmware container as
  # the builds, with a cache of their own for the native platform.
  unit_tests:
    name: unit tests (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Settings for the firmware container
        run: |
          echo "PIO_CORE=$RUNNER_TEMP/pio-core" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/pio-core"
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/pio-core
          key: pio-core-${{ runner.os }}-${{ runner.arch }}-native-${{ hashFiles('.docker/firmware/requirements.txt', 'diffbot_firmware/platformio.ini') }}
          restore-keys: |
            pio-core-${{ runner.os }}-${{ runner.arch }}-native-
      # pio test also passes when an environment runs no test case, for example when PlatformIO
      # finds no suite folder for it. So the step has PlatformIO write its JSON report, which
      # lists each suite with its environment (env_name) and its number of test cases
      # (testcase_nums). jq adds up each environment's test cases, and the step fails when one
      # of the two environments ran none.
      - name: Run the unit tests
        run: |
          .docker/firmware/run.sh pio test -e native -e native_googletest \
            --json-output-path .pio/unit-test-report.json
          for environment in native native_googletest; do
            test_cases="$(jq --arg environment "$environment" \
              '[.test_suites[] | select(.env_name == $environment) | .testcase_nums] | add // 0' \
              diffbot_firmware/.pio/unit-test-report.json)"
            echo "$environment: $test_cases test cases"
            if [ "$test_cases" -eq 0 ]; then
              echo "::error::The environment $environment ran no test case"
              exit 1
            fi
          done
