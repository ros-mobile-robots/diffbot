# Builds the robot image (.docker/robot) for arm64, the Raspberry Pi's architecture, and for
# amd64, each on a GitHub runner of that architecture, and runs the smoke test in it. The smoke
# test needs no hardware; a test on the real robot is still needed after a change.
# On noetic-devel, the publish job then publishes the tested images to GitHub's container
# registry as ghcr.io/ros-mobile-robots/diffbot-robot, for the robot to download.
# It is a workflow of its own because it runs only when the image's inputs change, needs a runner
# of each architecture, and is the only workflow that may write packages.

name: Robot container

# When it runs: on pushes to noetic-devel and on pull requests, but only if one of the files under
# paths changed. These are the image's folder, this workflow, the packages built into the image, and
# the list of the repositories it fetches. ** matches every file in a folder and its subfolders.
# Changes elsewhere, such as Gazebo or navigation, don't affect the image. workflow_dispatch adds a
# button to run it by hand, in the repository's Actions tab.
on:
  push:
    branches: [noetic-devel]
    paths:
      - .docker/robot/**
      - .dockerignore
      - .github/workflows/robot_container.yml
      - diffbot_base/**
      - diffbot_bringup/**
      - diffbot_control/**
      - diffbot_description/**
      - diffbot_msgs/**
      - remo_robot.repos
  pull_request:
    paths:
      - .docker/robot/**
      - .dockerignore
      - .github/workflows/robot_container.yml
      - diffbot_base/**
      - diffbot_bringup/**
      - diffbot_control/**
      - diffbot_description/**
      - diffbot_msgs/**
      - remo_robot.repos
  workflow_dispatch:
    inputs:
      first_publication:
        description: >-
          First publication: only if the first publication on noetic-devel stopped because the
          registry didn't let it read the package that doesn't exist yet
        type: boolean
        default: false

# Read-only, except for the publish job
permissions:
  contents: read

# Each action is named by the full commit of a release, with the release in the comment after it.
# A commit can't be moved to other code later, as a tag such as v7 can. That matters most in the
# publish job, whose actions run with the right to write packages. To update an action, take the
# commit of its new release from the action's repository and change the comment with it.

defaults:
  run:
    # bash with pipefail: a failing docker save in a pipe fails the step
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-24.04-arm: GitHub's arm64 runner, free for public repositories
          - runner: ubuntu-24.04-arm
            arch: arm64
          - runner: ubuntu-24.04
            arch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      # The job's token can only read, and git doesn't need it after the checkout either
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The template that users copy to .env must give a valid configuration
      - name: Check the settings template
        run: docker compose --env-file .docker/robot/env.example -f .docker/robot/compose.yaml config --quiet
      # With the template's settings and without ROBOT_IMAGE, both services run the published
      # image, the one that a robot downloads on its first start
      - name: Check the image that the robot downloads
        run: |
          cd .docker/robot
          images=$(env -u ROBOT_IMAGE docker compose --env-file env.example --profile lidar \
            -f compose.yaml config --format json |
            jq -c '{bringup: .services.bringup.image, lidar: .services.lidar.image}')
          expected='{"bringup":"ghcr.io/ros-mobile-robots/diffbot-robot:noetic","lidar":"ghcr.io/ros-mobile-robots/diffbot-robot:noetic"}'
          test "$images" = "$expected"
      # A build of one's own must never be planned under the published image's name. ROBOT_IMAGE
      # is set to that name here, every profile is on, so that the lidar service counts too, and
      # the two files are combined in both orders. The names that a build can give an image are
      # the service's image and the tags of its build section: the only such name has to stay
      # diffbot-robot:local, and compose.yaml alone has to build nothing.
      - name: Check the name of a local build
        env:
          ROBOT_IMAGE: ghcr.io/ros-mobile-robots/diffbot-robot:noetic
        run: |
          cd .docker/robot
          built_images() {
            docker compose --profile '*' "$@" config --format json |
              jq -c '[.services[] | select(.build) | .image, .build.tags[]?] | unique'
          }
          test "$(built_images -f compose.yaml)" = '[]'
          test "$(built_images -f compose.build.yaml)" = '["diffbot-robot:local"]'
          test "$(built_images -f compose.yaml -f compose.build.yaml)" = '["diffbot-robot:local"]'
          test "$(built_images -f compose.build.yaml -f compose.yaml)" = '["diffbot-robot:local"]'
      # The publish job's script, without a registry: stand-ins answer its reads, and the test
      # checks which tags the script writes for each answer of the registry.
      - name: Test the publish script
        run: .docker/robot/test_publish_image.sh
      # The label says which commit the image is built from, also on the robot (docker inspect)
      - name: Build the robot image
        run: >-
          docker build -f .docker/robot/Dockerfile -t diffbot-robot:noetic
          --label "org.opencontainers.image.revision=$GITHUB_SHA" .
      - name: Smoke test, without hardware
        run: >-
          docker run --rm
          -v "$PWD/.docker/robot/smoke_test.sh:/smoke_test.sh:ro"
          diffbot-robot:noetic bash /smoke_test.sh
      # The same test through compose.yaml, with its mounts and groups: the log folder must be
      # writable for the user ros. The runner's user isn't UID 1000, so the folder is opened up
      # here; /dev/null stands in for the Teensy. ROBOT_IMAGE selects the image just built, and
      # --pull never keeps Compose from downloading a published one instead.
      - name: Smoke test through Docker Compose
        env:
          ROBOT_DATA: ${{ runner.temp }}/robot-data
          TEENSY_DEVICE: /dev/null
          ROBOT_IMAGE: diffbot-robot:noetic
        run: |
          docker image inspect "$ROBOT_IMAGE" > /dev/null
          mkdir -p "$ROBOT_DATA" && chmod a+rwx "$ROBOT_DATA"
          docker compose -f .docker/robot/compose.yaml run --rm --pull never \
            -v "$PWD/.docker/robot/smoke_test.sh:/smoke_test.sh:ro" bringup bash /smoke_test.sh
          ls "$ROBOT_DATA/log"
      # On noetic-devel, hand the tested image to the publish job, which runs on another runner
      - name: Save the tested image
        if: >-
          github.repository == 'ros-mobile-robots/diffbot' &&
          github.ref == 'refs/heads/noetic-devel' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: docker save diffbot-robot:noetic | gzip -1 > "$RUNNER_TEMP/robot-image.tar.gz"
      - name: Upload the tested image
        if: >-
          github.repository == 'ros-mobile-robots/diffbot' &&
          github.ref == 'refs/heads/noetic-devel' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: robot-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/robot-image.tar.gz
          # Compressed already. A rerun of this job replaces its archive.
          compression-level: 0
          overwrite: true
          if-no-files-found: error
          retention-days: 1

  # Publishes the images that passed both smoke tests, on noetic-devel only, never for a pull
  # request: .docker/robot/publish_image.sh explains the tags. If it fails, rerun it while the
  # archives exist (one day), or else the whole workflow.
  publish:
    needs: build
    if: >-
      github.repository == 'ros-mobile-robots/diffbot' &&
      github.ref == 'refs/heads/noetic-devel' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    # A copy that hangs would hold the queue of publications. A publication takes a few minutes.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # One publication at a time. Up to 100 more wait for their turn, and none of those is
    # cancelled. GitHub cancels a publication only if it arrives while 100 are waiting already.
    concurrency:
      group: robot-image-publish
      queue: max
    steps:
      # The whole history, so that noetic only moves forward. The token stays out of git's settings:
      # this job's token may write packages, and git doesn't need it after the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: robot-image-*
          path: ${{ runner.temp }}/robot-images
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested images
        env:
          FIRST_PUBLICATION: ${{ inputs.first_publication }}
        run: >-
          .docker/robot/publish_image.sh ghcr.io/ros-mobile-robots/diffbot-robot
          "$GITHUB_SHA" "$RUNNER_TEMP/robot-images"
