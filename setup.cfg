# The Python style check: the settings of ROS 2's ament_flake8 for flake8, and mypy for the type
# hints, which every function must have, for Python 3.8, Noetic's version. With the tools of
# scripts/requirements-lint.txt, in the repository's root:
#   flake8 .
#   mypy .

[flake8]
max-line-length = 99
import-order-style = google
extend-ignore = B902,C816,D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D404,I202
# Build output, also of a catkin workspace or PlatformIO inside the checkout
extend-exclude = .pio,build,devel,install,logs

[mypy]
python_version = 3.8
ignore_missing_imports = True
disallow_untyped_defs = True
# mypy skips folders whose name starts with a dot, such as .pio, by itself
exclude = (^|/)(build|devel|install|logs)/
