; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = teensy40

; The Teensy platform in the version that the builds and the unit tests were checked with. Its
; compiler (GCC 15.2) builds both boards as C++17 (-std=gnu++17).

[env:teensy31]
platform = teensy@6.0.0
board = teensy31
; Converting floats to text pulls in newlib's assert, which writes to stderr and needs
; _write. The Teensy 3 core defines it, but without -u the linker doesn't include it
; ("undefined reference to `_write'").
build_flags = -Wl,-u,_write
framework = arduino
lib_deps = 
    frankjoshua/Rosserial Arduino Library@^0.9.1
    adafruit/Adafruit Motor Shield V2 Library@^1.0.11
    Wire

[env:teensy40]
platform = teensy@6.0.0
board = teensy40
framework = arduino
lib_deps = 
    frankjoshua/Rosserial Arduino Library@^0.9.1
    adafruit/Adafruit Motor Shield V2 Library@^1.0.11
    Wire

; Unit tests on the PC, without a Teensy: pio test -e native
; Only the suites that don't need the Arduino core run here. They use rosserial's node handle
; with a fake serial port (test/fakes); its library declares the Arduino framework, which the
; native platform doesn't have, so the compatibility check is off for it.
[env:native]
platform = native
test_filter =
    test_bno055
    test_imu_publisher
    test_synced_node_handle
    test_wire_bus
lib_deps =
    frankjoshua/Rosserial Arduino Library@^0.9.1
lib_compat_mode = off
; C++17, as on the Teensy, without the GNU extensions, so that the code stays portable
build_flags = -std=c++17 -Wall
