; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = teensy40

; The unit tests use two frameworks, and each suite is written for one of them:
;   test/test_<name>/             Unity, which can also run on a Teensy
;   test/googletest/test_<name>/  GoogleTest, which PlatformIO doesn't offer for a Teensy
; The test_ignore of this section holds for every environment, so none of them runs a GoogleTest
; suite. Only native_googletest, at the end of this file, sets a test_ignore of its own. So no
; environment builds a suite with the other framework, also when a call names the suite with
; --filter: pio test -e native --filter "googletest/*" runs nothing.
[env]
test_ignore = googletest/*

; The Teensy platform in the version that the builds and the unit tests were checked with. Its
; compiler (GCC 15.2) builds both boards as C++17 (-std=gnu++17).

[env:teensy31]
platform = teensy@6.0.0
board = teensy31
; Converting floats to text pulls in newlib's assert, which writes to stderr and needs
; _write. The Teensy 3 core defines it, but without -u the linker doesn't include it
; ("undefined reference to `_write'").
build_flags = -Wl,-u,_write
framework = arduino
lib_deps = 
    frankjoshua/Rosserial Arduino Library@^0.9.1
    adafruit/Adafruit Motor Shield V2 Library@^1.0.11
    Wire

[env:teensy40]
platform = teensy@6.0.0
board = teensy40
framework = arduino
lib_deps = 
    frankjoshua/Rosserial Arduino Library@^0.9.1
    adafruit/Adafruit Motor Shield V2 Library@^1.0.11
    Wire

; The Unity suites on the PC, without a Teensy: pio test -e native
; Only the suites that don't need the Arduino core run here. They use rosserial's node handle
; with a fake serial port (test/fakes); its library declares the Arduino framework, which the
; native platform doesn't have, so the compatibility check is off for it.
[env:native]
platform = native
test_framework = unity
test_filter =
    test_bno055
    test_command_timeout
    test_imu_publisher
    test_pid
    test_ros_wheel_command_subscriber
    test_synced_node_handle
    test_wheel_control
lib_deps =
    frankjoshua/Rosserial Arduino Library@^0.9.1
lib_compat_mode = off
; C++17, as on the Teensy, without the GNU extensions, so that the code stays portable
build_flags = -std=c++17 -Wall

; The GoogleTest suites on the PC, without a Teensy: pio test -e native_googletest
; They are for code that includes no Arduino and no rosserial header, such as the firmware's
; core. So this environment has no rosserial library, and a suite that includes one of its
; headers doesn't build here.
[env:native_googletest]
platform = native
test_framework = googletest
test_filter = googletest/*
; Instead of the GoogleTest suites, this environment ignores the Unity suites, which lie
; directly in test/
test_ignore = test_*
; PlatformIO 6.2.0's GoogleTest runner asks for google/googletest@^1.17.0, which is any 1.x
; release from 1.17.0 on. PlatformIO installs the exact version below first, and that version
; satisfies the runner's range. So every PC and CI build the tests with the same GoogleTest.
; When PlatformIO's version changes (.docker/firmware/requirements.txt), check its range again.
lib_deps =
    google/googletest@1.17.0
; The same C++ standard and warnings as the Unity suites
build_flags = ${env:native.build_flags}
