# Gazebo only: the gains of the PID that gazebo_ros_control's DefaultRobotHWSim uses to turn each
# wheel's velocity command into a torque. On the real robot, the Teensy firmware controls the
# wheel speed. diffbot_control.launch loads this file with the model argument.
# - The I term removes the steady speed error that a P gain alone leaves when turning on the spot.
#   control_toolbox limits it to +-i_clamp (N m), and antiwindup stops the integral from growing
#   beyond that limit.
# - P must stay below about 0.035: Remo's wheels weigh 32 g, and when a wheel doesn't touch the
#   ground (at spawn) or slips, P * 0.001 s / its inertia 1.75e-5 kg m^2 must stay below 2, or the
#   velocity loop becomes unstable and the model explodes (#57, #116)
diffbot:
  gazebo_ros_control:
    pid_gains:
      front_right_wheel_joint: &wheel
        p: 0.03
        i: 0.6
        d: 0.0
        i_clamp: 0.05
        antiwindup: true
      front_left_wheel_joint: *wheel
