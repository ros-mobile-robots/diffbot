mass: 0.5        # Wheel mass in Kg
radius: 0.0333    # Wheel radius in m, measured: diameters 66.3 mm (one wheel) and 66.8 mm (the other)
length: 0.025     # Wheel length in m, considering is as a cylinder
mesh: '../components/wheel.stl'          # Name of the mesh files. Leave it empty ('') to have a red wheel
#mesh: ''
scale: ''
x_offset: 0.079
y_offset: 0.0165  # Gives the measured wheel separation of 0.138 m, center to center: base y_size 0.08 + 2 * (y_offset + length / 2)
z_offset: -0.017
