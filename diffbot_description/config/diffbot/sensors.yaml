laser:
  mass: 0.190        # Lidar mass in kg: 190 g, typical for the RPLidar A2M8 in its datasheet
  radius: 0.015     # Wheel radius in m
  length: 0.01      # Wheel length in m, considering is as a cylinder
  mesh: 'rplidar-a2.stl'  # Name of the mesh files. Leave it empty ('') to have a red wheel
  #mesh: ''
  dx: 0.0
  dy: 0.0
  dz: 0.04
  angular_range:
    min: -3.1415
    max: 3.1415
  color: Gazebo/Grey
  enable_gpu: false

imu:
  # DiffBot has no IMU on the robot yet: the simulation's IMU weighs next to nothing, so that the
  # model keeps the robot's weighed mass. A BNO055 board weighs about 5 g.
  mass: 0.001
  size:             # A BNO055 breakout board, in m
    x: 0.027
    y: 0.020
    z: 0.004
  mesh: ''          # No mesh: a red box of this size
  scale: '0.001 0.001 0.001'
