# Runs the robot image on the robot's computer, with Docker Compose. From the repository's root:
#   docker compose -f .docker/robot/compose.yaml up --build             # the bringup
#   docker compose -f .docker/robot/compose.yaml --profile lidar up     # the bringup and the lidar
# Settings come from the shell or from a .env file next to this file (see README.md):
#   ROBOT_MODEL     remo (default) or diffbot; REPOS: remo_robot.repos (default) or diffbot_robot.repos
#   TEENSY_DEVICE   the Teensy's stable name on the host (default /dev/teensy, see 99-diffbot-robot.rules)
#   LIDAR_DEVICE    the lidar's (default /dev/rplidar)
#   DIALOUT_GID     the numeric ID of the host's group that owns the serial devices (default 20, dialout)
#   ROS_MASTER_URI, ROS_IP, ROS_HOSTNAME   as on ROS Network Setup; without them, roslaunch starts its own master
#   ROBOT_DATA      a host folder for ROS logs and bags (default ./data, next to this file)

name: diffbot-robot

# Settings that both services share (a YAML anchor)
x-robot: &robot
  image: diffbot-robot:noetic
  # The host's network, so that ROS reaches the PC as in the native setup, without port lists
  network_mode: host
  # Let the user ros in the container open the serial devices: add the numeric ID of the group
  # that owns them on the host. A group name could have a different ID in the container.
  group_add:
    - "${DIALOUT_GID:-20}"
  environment:
    - ROS_MASTER_URI
    - ROS_IP
    - ROS_HOSTNAME
  volumes:
    - ${ROBOT_DATA:-./data}:/home/ros/.ros

services:
  # The hardware interface, the controllers and rosserial to the Teensy, which drives the motors
  # and reads the encoders. The launch file expects the Teensy at /dev/ttyACM0.
  bringup:
    <<: *robot
    build:
      context: ../..
      dockerfile: .docker/robot/Dockerfile
      args:
        REPOS: ${REPOS:-remo_robot.repos}
    devices:
      - ${TEENSY_DEVICE:-/dev/teensy}:/dev/ttyACM0
    command: roslaunch diffbot_bringup bringup.launch model:=${ROBOT_MODEL:-remo}

  # The lidar driver; only with --profile lidar. Its launch file expects /dev/ttyUSB0.
  lidar:
    <<: *robot
    profiles: [lidar]
    depends_on: [bringup]
    devices:
      - ${LIDAR_DEVICE:-/dev/rplidar}:/dev/ttyUSB0
    command: roslaunch diffbot_bringup rplidar.launch
